[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "siliconsense-api"
version = "0.1.0"
description = "SiliconSense by SpideyTech - FastAPI Backend & Deterministic Scoring Engine"
readme = "../../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sqlalchemy>=2.0.35,<3.0.0",
    "alembic>=1.13.2,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pandas>=2.2.2,<3.0.0",
    "numpy>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "httpx>=0.27.2,<1.0.0",
    "ruff>=0.6.8,<1.0.0",
    "mypy>=1.11.2,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true