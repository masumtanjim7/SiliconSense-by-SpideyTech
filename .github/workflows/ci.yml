name: SiliconSense CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-ci:
    name: FastAPI Lint, Typecheck, Migrations & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siliconsense
          POSTGRES_PASSWORD: siliconsense_dev_pw
          POSTGRES_DB: siliconsense_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://siliconsense:siliconsense_dev_pw@localhost:5432/siliconsense_dev
      TEST_DATABASE_URL: postgresql+psycopg://siliconsense:siliconsense_dev_pw@localhost:5432/siliconsense_dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Lint
        run: python -m ruff check .

      - name: Mypy Typecheck
        run: python -m mypy app tests

      - name: Alembic Migrations Check
        run: python -m alembic upgrade head

      - name: Run Pytest
        run: python -m pytest

  web-ci:
    name: Next.js Typecheck, Vitest & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript Check
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build
